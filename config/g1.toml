# G1 部署运行配置（echo 机）—— run_g1_execute / run_g1_loop / run_g1_inference /
# g1_pose_warmup 四脚本共享。优先级：命令行显式传参 > 本文件 > 脚本内置默认。
# 改完保存即生效（下次运行读取）；脚本启动会打印本文件实际覆盖了哪些项。
# 注意：--exec（真实运动）不在本文件里，每次命令行显式给。
# 与 scripts/inference/g1_config.py 的 BUILTIN 保持同源，两边一起改。
#
# 单位约定：角度 rad｜时长 s｜速度 rad/s（夹爪 m/s）｜力 N｜百分比 %｜频率 Hz

[run]
# 部署目录（g1_ckpt_prep 产物；norm_stats/manifest 从这里读）。
# warmup 等脚本直接读 <ckpt>/norm_stats.json。⚠ 各机产物目录名不同：
# 本机（第三台）= pi05_g1_place_deploy（pi05_g1_place/040000 的包装，
# 2026-09-29 norm_align_check 全绿）；
# echo 机 = pi05_g1_ft（2026-09-23/24 全部真机验证用它）；
# 另一设备 = pi05_g1_deploy——各机以本文件为准。
ckpt = "/home/galbot/holy/models/pi05_g1_onlypick_deploy"
# 当前=pick 任务·在役 only_pick（2026-10-15 晚切回：B 单任务 place 测试通过，
# 回 pickplace 双任务 A/B）。pick 闭环必带 --grip-state-cmd（10-05/10-08
# 两次应验）。
# ── place·B 三键存档（2026-10-15 单任务测试通过销案；A/B 全流程走 ab_test
#    编排器，B 侧不依赖本文件）──
#   ckpt=pi05_g1_sft1012_dropout20_deploy + 下存 place 句 + place pose
#   （33% 持物起始）；必用 ab_test B loop 且带 --no-head-crop——sft_1012
#   分任务图像处理（10-15 同事确认：pick 训练=头裁剪、place 训练=原样
#   letterbox），13:18 全流程 place 相 R 爪 25 轮不放已破案=place 相错吃
#   裁剪图（--no-head-crop 后单任务 place 即通过）；place 闭环不带
#   --grip-state-cmd（33% 持物起步，喂指令值与训练分布相反——10-12 判读）。
# 可切回三键存档：
#   place 任务（10-12 复验线）：ckpt=pi05_g1_place_deploy
#     + place 句 + pi05_g1_place_deploy/episode_start_task0.json（33% 持物起始语义）。
#     ⚠ 持物物理 place 复验挂着（全天空爪排练的空爪疑云未销案）。
#     ⚠ place 闭环不带 --grip-state-cmd（33% 持物起步，滞后窗内回读恰好是对的，
#       喂指令值反而与训练分布相反——10-12 判读）。
#   pick 注：该 ckpt action stats 为绝对角量级（前两代=delta 量级）——已判明系训练
#     框架把 stats 取样挪到 relative 转换之前，targets 仍 delta（10-08 只读探针：
#     首步臂维全部毫弧度级增量），部署链路 BASE_ARM+delta 语义不变。
#     （换装注：用户重训 0930_pick_place_all_sft_pi05_relative，QUANTILES，
#     norm_align_check 全绿 往返 6.2e-06；起始位姿/包络沿用 pick 工位件。）
#   旧 pick 权重（pi05_g1_040000）：ckpt=pi05_g1_pick_deploy，句/位姿同 pick 存档。
# prompt 必须是训练 tasks.parquet 里的原句：
prompt = "Left arm pick up A. Right arm pick up A."
# place 任务句（place·B 存档，2026-10-15 单任务 place 真机验证可用）：
#   "Left arm places A in the top-left corner. Right arm places A in the top-left corner."
# ⚠ B（sft_1012）两串训练原句待与同事核对（挂账降级：pick 句 13:18 抓取成功
#   + place 句 10-15 单任务放爪成功，真机行为均已背书现用句）。

[warmup]
speed = 0.15        # 臂/头关节速度，rad/s（腿固定 0.2 rad/s 不在此调）
skip_zero = true    # 2026-10-12 起默认跳过段①零位（move_whole_body_joint_zero 走
                    # 规划器+碰撞检查，大偏移姿态常内部 TIMEOUT 臂停中途，9-23 实录；
                    # 段② 关节直控不经规划器）。折叠/收拢等大偏移姿态需零位时
                    # 命令行 --no-skip-zero 显式开回
skip_leg  = false   # true=跳过段②b 躯干/腿对齐
# 目标位姿文件（g1_pose_extract.py 从数据集起始帧生成的 23 维中位；
# 优先级 --pose-file > 这里 > 部署目录 episode_start_task0.json 零配置发现）。
# 手调初始位姿：直接改 json 的 start_pose，或生成变体文件换这一行指向。
pose_file = "/home/galbot/holy/models/pi05_g1_onlypick_deploy/episode_start_task0.json"
# pick 任务起始（0% 闭爪，2026-10-15 切回）。
# place 任务存档（33% 持物语义；物理位姿，各权重通用）：
#   "/home/galbot/holy/models/pi05_g1_place_deploy/episode_start_task0.json"

[execute]           # run_g1_execute（3 步 smoke）
steps = 3           # 执行 chunk 前 K 步，步（≤10）
delta_max = 0.05    # 每步相对当前读数限幅，rad/步
speed = 0.15        # 关节速度上限，rad/s

[loop]              # run_g1_loop.py（闭环唯一入口；= 2026-10-07 工作点 v3，
                    # 前置=--nav-suspend（导航栈冻结→推理稳 329±7ms）；
                    # legacy/run_g1_loop_stale.py（原 A 脚本，存档）兼容同配置
                    # 但不识 --nav-suspend。命名对照见 docs/lerobot-alignment.md）
rounds = 200        # 推理→执行循环轮数。双臂 place 预算：spc=20 时代实测 52-60 轮
                    # （9/30 判别跑）；v3 实测落盒 ~27 轮（t+10.0s，空爪纪录）→
                    # 观察跑 60，200 留余量。
                    # q 停纪律：R 落盒才停，L 落盒勿停（双臂严格串行）。
n_action_steps = 25     # 每轮执行 chunk 前 K 步（lerobot 术语，旧名 steps_per_round）。
                        # 速度律：臂速÷原速=n÷(30×pace×div) → 25/0.35/1.5 ≈ 1.59×
                        # 原速（工作点 v3，10-07）；v2=25/0.38/1.65 ≈ 1.33×（10-04
                        # 定案，落盒 14.0-14.5s 纪录）。25 把 50 步 chunk 整除成
                        # 2 轮/块（20 会留 10 步尾巴轮）；反例 10-07：
                        # 15/(30×0.35×1.5)=0.95×，落盒拖到 78 轮 27.8s+
                        # ——本参数是速度律分子，往下调=交回结构杠杆
steps_per_command = 25  # 合步：一条 SDK 指令跨 K 个 chunk 步（=n_action_steps，
                        # 整轮一条平滑轮廓；合步不跨 chunk）
delta_max = 0.3     # 每步限幅，rad/步（工作点典型步距 3-10 mrad，0.3 只兜快相位削顶）
speed = 1.0         # 关节速度上限，rad/s（0.25 会削工作点快相位，9/30 实测 1.0）
pace = 0.35         # 配速窗口，s。v3：nav-suspend 下水位≈0.34-0.35（推理 329+取图
                    # +开销），0.35 实测轮耗时 p50 356ms、hold 窗=0（两跑 38+38 轮）。
                    # 0.34 以下勿入=贴水崖边，偶发抖动即回流 hold 窗（10-04 的
                    # "0.35-0.43 墙钟相同"死区会换水位重演）。旧 0.38（v2）与
                    # 水位 ~0.42 时代结论见 git 历史
pace_div = 1.5      # 配速系数。v2 时代 div 饱和三档零差是"轮时间钉在水位"下的
                    # 结论；v3 pace 活了 div 才开始有意义。1.5 实测：落盒 t+10.0s
                    # 纪录，代价=导程残差 p50 79/max 283 mrad、8/37 段≥100
                    # （v2 1.33× 时 p50 30-40）——臂持续吃滞后，持物复验前保留观察。
                    # div 兼覆盖率 1/div 与滞后滤波
near_div = 1.85     # 近距阻尼：导程<near_gap 时配速系数改用此值——单调几何收敛
                    # （永不过冲）+滤模型放置位犹豫摆幅。2026-10-12 用户真机定案
                    # 1.85：0=关闭实测抓取飘逸（阻尼的过冲防护是真需求）；旧 2
                    # 有效但偏滞。1.85 每窗走导程 54%（2=50%），近区臂速 +8%。
                    # 9/30 L 释放段真机验证：干净衰减进释放、无振荡
near_gap = 0.06     # 近距阻尼触发导程，rad（60 mrad）
near_bypass = 15    # 抓取事件（任一爪开→合穿越）后近阻尼旁路轮数：L 抓住后的
                    # 返回/后撤段强制全速（ep0 后撤窗 ~4s≈11 轮@v3，15 留余量），
                    # 到期自动交还常规判定；place 持物接近放置段的阻尼不受影响
                    # （2026-10-12，用户需求"抓住后快点推出阻尼"；0=关闭）
near_n = 0          # 近窄轮（0=只动配速不动步宽）：近阻尼触发时本轮配额/指令
                    # 宽度收缩为 N 步（spc 联动=min(spc,N)，与 near_div 同窗生效，
                    # 每轮轮首重置、退出近态自动回全宽）——每轮吃最新观测重规划的
                    # 短导程，目标链贴臂无滞后税，代价=时间线变慢 ~n/N。
                    # ⚠ spc15 工作点近态占大头（10-10 实测 118/131 轮），开它
                    # ≈全程慢放；更适合 v3 型快巡航做末段精刹（10-13 新增）
near_exit = 0       # 近态滞回退出阈值 rad（0=2×near_gap=0.12）：进态用 near_gap、
                    # 退态用本值。10-13 首跑实录：单阈值时接近段 25 步增量在
                    # 60 mrad 两侧逐轮翻转=窄↔宽速度方波往复摆动（轮 9-21 完美
                    # 交替 13 轮，loop_20261013_100407），滞回后整段稳定驻留近态
cache_frames = 1    # K/V 时序复用周期：1=每帧全量（默认，恒定）。2 已判死（9/30
                    # 闭环 A/B+结构判读）：state 进 prompt → 每轮 set_prompt 重置
                    # 前缀计数，永远全量跑=纯空转；且绕过重置=模型拿陈旧本体状态
                    # 规划，比陈旧视觉更糟。勿再试
max_excursion = 3.0    # 偏离起始位护栏，rad，任一关节超限即停。
                       # 2026-09-23 按数据集重标：199 轨合法抓取全程包络
                       # max 2.785（中位 1.17），旧值 0.25 是语义测试期防漂移
                       # 值，真任务 100% 误触；3.0 仍兜住失控漂移
settle = false      # true=停走（旧行为）；false=追踪式（v4 半程配速）
settle_frac = 0.5   # settle 模式换目标阈值，比例（追踪式已不用，保留兼容）
switch_dist = 0.06  # 【追踪式 v4 起不再使用，保留兼容】旧提前重定向阈值，rad
chunk_mode = "track"    # track / settle / traj（traj 走 PVT，已封存慎用）
traj_dt = 0.1       # traj 模式轨迹点周期，s/点（0.033=采集原速 30fps）

[replay]            # run_g1_replay（数据集影子回放）专用，与 loop 解耦
speed = 0.15        # 关节速度上限，rad/s。按 ep0 增量分布定标（2026-09-24）：
                    # 每控制步最忙关节位移 p95=0.147，÷0.75s 自然窗口≈0.2，
                    # 取 0.15 → 90% 步窗口内自然完成，全程无满速冲刺
pace = 0.95         # 节拍窗口，s：目标前视 6 帧、速度=导程÷(2×窗口) 半程配速，
                    # 每窗只走一半导程→臂恒在途永不到点；窗口自发令前起算，
                    # 推理重叠在内（2026-09-24 v4，治"一顿一顿"；外部方案
                    # 根因 A/B 的 SDK 等效实现；速度下限 0.02 rad/s 内置）
catch_timeout = 8.0 # 到位确认超时，s（超时警告推进。轨迹锁定，数据集自动慢放）
chunk_mode = "track"    # track / settle / traj（traj 走 PVT，已封存慎用）
traj_dt = 0.1       # traj 模式轨迹点周期，s/点（0.033=采集原速 30fps）

[gripper]           # execute/loop 的 --grip、warmup 的 --grip 共用
enabled = true      # 日常默认开；显式关：命令行 --no-grip 或改 false
speed = 0.15        # 夹爪线速度，m/s。0.05 判慢（2026-09-30）：数据集释放是
                    # 3 帧快开（0.1s），0.05 m/s 把 80mm 开行程拖成 1.6s=每爪
                    # 白扔 ~1.5s；0.15 开行程 0.53s。place 任务闭爪只在空爪
                    # （释放后回闭），无抓物冲击风险
effort = 30         # 夹爪力矩，N
chg = 2.0           # 重发变化阈值，%（0~100% 语义；变化小于它不重发）

[inference]         # run_g1_inference（只读推理）
rounds = 10         # 连续取图+推理轮数，轮
hold = 10           # 冻结帧纯推理次数，次
tier = "bf16"       # 量化档：bf16 / int8_enc / int8_full
                    # 2026-09-23 实证（tf_matrix 三档 teacher-forced）：INT8 两档
                    # 均毁动作质量（块均 cos 0.15/0.27 vs bf16 0.98，夹爪输出
                    # 8~21% 垃圾值），动作质量必须 bf16，延迟代价 ~+90ms
ctrl_hz = 30.0      # 控制频率，Hz（=数据集 fps；chunk 窗口=horizon÷30，50 步=1667 ms）

# ══════════════════════════════════════════════════════════════════════
# [lerobot] — run_g1_loop_traj.py 专用档（2026-10-21 用户定档=traj 标准版·
# lerobot 对齐版）。只给 traj 脚本消费，不与 [loop]/[run] 共享以免互劫。
# 标准跑缩到一条命令：run_g1_loop_traj.py --exec（cli > 本档 > BUILTIN 三态，
# 逐项覆盖示例见 USAGE §3.8）。
# 与同事 infer_policy 栈逐项对齐：爪=关节流（tfs=0 关节路径，set_gripper_
# command 端点起步定律不适用）、skip_install=skip_frames、seam_overlap_alpha
# =weighted_average（0.7=0.3 旧+0.7 新）、ema_alpha=action_filter
# （dim23 全维单滤镜，爪维默认跟随）。
# ⚠ ckpt 耦合：rtc_horizon/head_crop 只对 training_rtc_d10 且 pick 相合法
#（place 训练无裁剪=place 相带 --no-head-crop；非 RTC 训练 ckpt 开引导=
# 拉弯 chunk 伸歪，10-16 定罪——脚本有 ckpt 名守卫提示）。
# ══════════════════════════════════════════════════════════════════════
[lerobot]
ckpt = "/home/galbot/holy/models/pi05_g1_training_rtc_d10_deploy"
prompt = "Left arm pick up A. Right arm pick up A."
rounds = 200             # 轮
n_action_steps = 0       # 0=换块即取新计划（水位 0；新鲜度是接缝第一杠杆）
skip_install = true      # 换块跳帧安装（同事 skip_frames 墙钟对齐）；反关 --no-skip-install
seam_overlap_alpha = 0.7 # 换块重叠混接，新计划权重（同事 weighted_average）
cmd_every = 1            # 纯流式直发（合步 N>1 与 overlap 相性未验勿混）
ema_alpha = 0.3          # 行目标 EMA（dim23 全维；爪维默认跟随此值）
grip_state_cmd = true    # state 爪维喂指令值（数据集语义；忘带=R 爪死 0）；反关 --no-grip-state-cmd
delta_max = 0.05         # rad/步（对原始增量 0.00% 截断=封版）
burst_reserve_ms = 0.0   # 纯流式无突发预算
nav_suspend = true       # 闭环期搁置导航栈 7 进程（醒着 +60ms 税）；反关 --no-nav-suspend
rtc_horizon = 10         # 前缀引导窗口（trained-RTC 权重专属，抹剩余接缝；0=关）
head_crop = true         # 头图裁剪放大（sft_1012 训练同款；place 相勿带）；反关 --no-head-crop
