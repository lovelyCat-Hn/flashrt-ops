# S1 推理执行器共用档案——两个读者：run_s1_loop.py（适配器版，内联预扫描
# 只取它认识的键）与 run_s1_loop_traj.py（G1 traj 直移植版，s1_config 全量
# 三态回填）。键名与 G1 config/g1.toml [lerobot] 对齐体系
# （docs/lerobot-alignment.md）。顶层键 = CLI dest 名；CLI 显式传参覆盖 toml；
# 文件不存在则全用内置默认（s1_config.BUILTIN 镜像本文件）。

policy = "pi05"
ckpt = "/home/galbot/model_weights/pi05/S1_run_20261028_121132_b3f637a6_010000/pretrained_model"
prompt = "test"                          # 训练 task 字符串（tasks.parquet 全库唯一；in-distribution）
rounds = 200
ctrl_hz = 30.0                           # 行节拍（traj 脚本 dest=fps；勿降速=时间维 OOD）

# 水位=预取触发阈值（G1 traj 同名语义）：0=换块即预取（本块第 0 步下发后
# 立即后台起跑下一块推理，块长≈推理时延）；N=消费到第 K 步起跑。
# 换块=推理落地即整块换入弃尾；星饿超 starve-limit（CLI，默认 2.0s）停环
execute_actions_per_chunk = 0
# 行内插值帧数（10-29 审查③定档 8）：S1 singorix WBC 按 tfs 时间轴细插，
# tfs=0 ASAP=参考跳变→LP 削顶→力矩跳变=卡卡；traj 移植版每行并一包带时间轴
# 批。8 帧=4.17ms 点距 ≈ wbc_dt 4ms（250Hz 采样周期）——一个控制周期一个点
# 不浪费；此前 12（2.78ms）约 1/3 点被采样器跨过无收益。G1 traj 默认 1 勿抄
# （G1 伺服吃单点流，S1 不吃）
frames_per_row = 8
# 跨行攒批行数 R（10-29 审查②）：攒 R 拍帧并一包、tfs 铺满 R×tick 窗、每 R 拍
# 一发。R2×fr8 = 66.7ms 窗×16 点 = 30Hz 实时配方（真机窗口律 66.7ms 全安静、
# 点距越细越佳）；R1=33.3ms 窗（四角④已验「还好」，备选对照）
rows_per_cmd = 2
# rad/步（同事 control 段同名键同值；对原始增量 0.00% 截断=封版）
max_joint_delta_per_step = 0.05
# 行目标 EMA（同事 action_filter.lowpass.alpha 同名）：α=新样本权重；
# S1 初档 0.1（用户定案 2026-10-28；G1 现役 0.3，首跑后可 A/B）
filter_alpha = 0.1

# ── 爪（关节流=traj 标准）──
grip_path = "joint"                      # joint=set_joint_commands 关节流；cmd=set_gripper_command 逃生门
grip_velocity = 0.05                     # m/s 速度帽（pyi：爪维 velocity/effort 生效）
grip_effort = 10
grip_chg = 2.0                           # 仅 cmd 逃生门消费（joint 路各门旁路）

# ── traj 标准配方键（G1 [lerobot] 定档；run_s1_loop.py 不消费，忽略即可）──
skip_frames = true                       # 换块跳帧安装（水位 0 的官配对）
# 换块过渡=EMA 单层（用户定案 10-30「把换块那个也改成我们的 ema」）：
# latest_only=α新 1.0=新计划直通（混接 crossfade 退役）——缝平滑只留 EMA
# 跨块连续（α=filter_alpha 0.1，从 last_tgt 重播起链），一个旋钮一个机制。
# 召回同事栈 crossfade：--aggregate-fn weighted_average（α新 0.7）
aggregate_fn = "latest_only"
cmd_every = 1                            # 纯流式直发
burst_reserve_ms = 0.0
cache_frames = 1                         # 2 已判死（G1 9/30 实录）
max_excursion = 3.0
# S1 判读（勿照抄 G1 定档的键）：
grip_state_cmd = false                   # state 爪维喂实时回读（SDK 爪回读滞后未测，首跑专项核查）
nav_suspend = false                      # S1 无导航栈，旗标 no-op（兼容档键）
execution_horizon = 0                    # trained-RTC 专属；S1 pi05 非 RTC 权重
head_crop = false                        # S1 训练口径=4:3 letterbox 全幅

# ── G1 [lerobot] 键的 S1 判读（无对应=刻意不带，非遗漏）──
#   subtask_every              : fineart System 2 降频键，适配器版专属
#   live_frames                : 适配器版合成图开关；traj 版取图即真实相机
#                                （冻结守卫常开），无此概念
#   execution_horizon = 10     : 同上 execution_horizon=0 判读
