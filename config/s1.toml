# S1 通用推理执行器档案（run_s1_loop.py）——键名与 G1 config/g1.toml [lerobot]
# 同体系（lerobot/同事路线对齐名，命名档案=docs/lerobot-alignment.md）。
# 顶层键 = CLI dest 名；CLI 显式传参覆盖 toml；文件不存在则全用内置默认。

policy = "pi05"
ckpt = "/home/galbot/model_weights/pi05/S1_run_20261028_121132_b3f637a6_010000/pretrained_model"
prompt = "test"                          # 训练 task 字符串（tasks.parquet 全库唯一；in-distribution）
rounds = 200
ctrl_hz = 30.0                          # 行节拍（S1 扩展键；G1 定盘 30Hz 口径）

# 水位 0：整块行流完（50 行≈1.67s）立即重推理（新鲜度第一杠杆；同事/G1
# 同名键同款）。发令=G1 traj 同款逐帧墙钟直发（tfs=0），不整块打包
execute_actions_per_chunk = 0
# 不插值纯 30Hz 直发（用户定案；G1 traj 同名旗）；>1 启用行内插值微流
frames_per_row = 1
# 跨行打包行数 R：命令窗口=R×行周期（与行周期解耦）。10-28 真机窗口律
# （回放台 A/B 用户耳听判据）：卡顿⇔单点无未来（R=1&fr=1）或窗口过短
# （30Hz 单行 33.3ms 仅"还好"）；66.7ms 窗全安静、点距细更佳（15Hz fr24
# 最佳）。30Hz 实时等价推荐 R=2×fr12（窗口 66.7ms/点距≈2.8ms）；
# 真机首验前保持 1=逐行原路径
rows_per_cmd = 1
# rad/步（同事 control 段同名键同值；对原始增量 0.00% 截断=封版）
max_joint_delta_per_step = 0.05
# 行目标 EMA（同事 action_filter.lowpass.alpha 同名）：α=新样本权重；
# S1 初档 0.1（用户定案 2026-10-28；G1 现役 0.3，首跑后可 A/B）
filter_alpha = 0.1

grip_velocity = 0.05
grip_effort = 10
# fineart System 2 子任务生成降频摊销（每 N 块一次；S1 扩展键，G1 无此概念；0=关）
# pi05=System 1 only 无 subtask 入口 → 0（fineart 线再用 25）
subtask_every = 0
live_frames = false

# ── G1 [lerobot] 键的 S1 判读（无对应=刻意不带，非遗漏）──
#   skip_frames / aggregate_fn : G1 换块跳帧安装/融合机构，S1 未带（水位 0 下
#                                块边界融合行为待真机首验再定）
#   cmd_every = 1              : S1 同语义恒为逐行直发（frames_per_row=1）；
#                                frames_per_row>1 是 G1 traj 同款插值微流，另册
#   grip_state_cmd = true      : S1 爪走独立 API、state 爪维喂实时回读；SDK 爪
#                                回读滞后未测——真机首跑专项核查（G1 滞后 6.3-8s，
#                                忘带=R 爪死 0）
#   nav_suspend = true         : S1 执行器无导航栈互动，N/A
#   execution_horizon = 10     : trained-RTC 专属；fineart rtc_config=None，N/A
#   head_crop = true           : G1 sft_1012 训练口径；fineart=360×640→224
#                                letterbox 全幅，N/A
